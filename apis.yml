aid: biome-makers
name: Biome Makers
description: 'Biome Makers is a global agricultural technology company founded in 2015 and headquartered
  in El Macero, California, that uses soil microbiome DNA sequencing and machine learning to measure and
  restore soil health. Its BeCrop platform decodes the functionality of soil microbial communities across
  200+ crops in 56+ countries, delivering agronomic recommendations, agricultural-input validation, and
  supply-chain sustainability benchmarking to farmers, ag retailers, CPG companies, and research labs.
  Products include BeCrop Farm, BeCrop Test, BeCrop Trials, and BeCrop Rate. BeCrop is accessible via API
  for large-scale partner integrations, though the developer API is partner-gated and no public OpenAPI
  specification is currently published.'
